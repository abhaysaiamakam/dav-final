services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      CROPLENS_STORAGE_BASE_DIR: /app/storage_data
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    volumes:
      - ./apps/api/storage_data:/app/storage_data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://croplens-api.abhaysaiamakam.workers.dev
    expose:
      - "3000"
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://gateway:80
    depends_on:
      - gateway
    profiles:
      - public
    restart: unless-stopped
